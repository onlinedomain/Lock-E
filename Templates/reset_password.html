<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset password - Lock-E</title>
    <style>
      :root {
        --bg: #2d1f16;
        --surface: #fbf7f2;
        --line: #dccfc1;
        --text: #4a3428;
        --muted: #4a3428;
        --accent: #4a3428;
        --error-bg: #f3dcd6;
        --error-text: #8a3b2a;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 18px;
        background: var(--bg);
        color: var(--text);
      }

      .card {
        width: 100%;
        max-width: 420px;
        padding: 32px 24px;
        background: var(--surface);
        border-radius: 18px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin-bottom: 8px;
        font-size: 28px;
      }

      p {
        margin-bottom: 20px;
        line-height: 1.5;
        color: var(--muted);
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      input {
        width: 100%;
        height: 56px;
        padding: 0 16px;
        font: inherit;
        background: #fff;
        border: 2px solid var(--line);
        border-radius: 12px;
      }

      input:focus {
        outline: none;
        border-color: var(--accent);
      }

      .btn {
        display: block;
        width: 100%;
        padding: 16px 24px;
        font: inherit;
        text-align: center;
        text-decoration: none;
        color: var(--surface);
        background: var(--accent);
        border: 2px solid var(--accent);
        border-radius: 999px;
        cursor: pointer;
      }

      .error {
        margin-bottom: 16px;
        padding: 12px 14px;
        font-size: 16px;
        color: var(--error-text);
        background: var(--error-bg);
        border-radius: 12px;
      }
    </style>
  </head>

  <body>
    <div class="card">
      {% if invalid %}
      <h1>Link expired</h1>
      <p>This reset link is invalid or has expired.</p>
      <a class="btn" href="/login">Back to login</a>
      {% else %}
      <h1>New password</h1>
      <p>Choose a new password for your Lock-E account.</p>

      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}

      <form method="POST">
        <input type="hidden" name="email" value="{{ email }}" />
        <input
          type="password"
          name="password"
          minlength="8"
          placeholder="New password (8 characters min.)"
          autocomplete="new-password"
          required
        />
        <input
          type="password"
          name="confirm"
          minlength="8"
          placeholder="Confirm new password"
          autocomplete="new-password"
          required
        />
        <button type="submit" class="btn">Change password</button>
      </form>
      {% endif %}
    </div>
  </body>
</html>
