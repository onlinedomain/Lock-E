<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
:root {
  --bg: #2d1f16;
  --surface: #fbf7f2;
  --line: #dccfc1;
  --text: #4a3428;
  --muted: #4a3428;
  --accent: #4a3428;
  --error-bg: #f3dcd6;
  --error-text: #8a3b2a;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 18px;
  background: var(--bg);
  color: var(--text);
}

/* ---------- Carte centrale ---------- */
#register-principal-div,
#login-principal-div {
  width: 100%;
  max-width: 420px;
  padding: 32px 24px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 18px;
}

h1 {
  font-size: 30px;
  color: var(--accent);
  text-align: center;
  margin-bottom: 24px;
}

/* ---------- Message d'erreur ---------- */
#register-error,
#login-error {
  padding: 14px 16px;
  margin-bottom: 20px;
  font-size: 16px;
  color: var(--error-text);
  background: var(--error-bg);
  border-radius: 10px;
}

/* ---------- Champs ---------- */
.form-inputs-div { margin-bottom: 20px; }

label {
  display: block;
  margin-bottom: 8px;
  font-weight: bold;
}

input {
  width: 100%;
  height: 56px;
  padding: 0 16px;
  font: inherit;
  color: var(--text);
  background: #ffffff;
  border: 2px solid var(--line);
  border-radius: 12px;
}

input::placeholder { color: #b8a595; }

input:focus {
  outline: none;
  border-color: var(--accent);
}

/* ---------- Boutons ---------- */
#register-submit,
#login-submit {
  width: 100%;
  height: 56px;
  margin-top: 4px;
  font: inherit;
  font-weight: bold;
  color: var(--surface);
  background: var(--accent);
  border: none;
  border-radius: 999px;
  cursor: pointer;
}

#register-submit:active,
#login-submit:active { opacity: 0.85; }

#to-login-from-register,
#to-register-from-login {
  display: block;
  width: 100%;
  margin-top: 20px;
  padding: 12px;
  font: inherit;
  font-size: 16px;
  color: var(--muted);
  background: none;
  border: none;
  cursor: pointer;
}

button:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}
  </style>
</head>
<body>

<div id="login-principal-div">

  <h1 id="login-title">Login</h1>

  {% if error %}
    <p id="login-error">{{ error }}</p>
  {% endif %}

  <form action="/login" method="POST">

    <div class="form-inputs-div">
      <label for="email">Email</label>
      <input id="email" type="email" name="email" value="{{ email or '' }}" placeholder="example@ex.com" required>
    </div>

    <div class="form-inputs-div">
      <label for="password">Password</label>
      <input id="password" type="password" name="password" placeholder="----------" required>
    </div>

    <button type="submit" id="login-submit">Login</button>
  </form>

  <button type="button" id="to-register-from-login">No account yet? Create one</button>

</div>

<script>
  document.getElementById("to-register-from-login").addEventListener("click", () => {
    window.location.href = "/register";
  });
</script>

</body>
</html>
